services:
  # 1. Cache e Mensageria (Resolve os Timeouts do WebSocket)
  redis:
    image: redis:7-alpine
    container_name: redis-evolution
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # 2. Banco de Sessões da Evolution API
  postgres-evolution:
    image: postgres:16-alpine
    container_name: postgres-evolution
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sua_senha_secreta_aqui}
    volumes:
      - pgdata_evolution:/var/lib/postgresql/data

  # 3. Gateway WhatsApp (Usando sua imagem local)
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-ChaveMestra123456}
      
      # Banco de dados
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-sua_senha_secreta_aqui}@postgres-evolution:5432/${POSTGRES_DB:-evolution}
      
      # Redis Config
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_REDIS_SAVE_INSTANCES: "true"
    depends_on:
      - postgres-evolution
      - redis
    volumes:
      - evolution_instances:/evolution/instances

  # 4. Motor de Orquestração (n8n)
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Recife
      - TZ=America/Recife
    volumes:
      - n8n_data:/home/node/.n8n

  # 5. Túnel Reverso Segura (Ngrok) para expor o n8n à internet
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok-tunnel
    restart: unless-stopped
    command:
      - "http"
      - "n8n:5678"
      - "--domain=egging-hangout-acclaim.ngrok-free.dev"
    environment:
      - NGROK_AUTHTOKEN=3IsfFNQfHBSzvGBPb2Y5kQjfEvj_4M7CqUVYnL3q83f5aYfDe
    depends_on:
      - n8n

volumes:
  redis_data:
  pgdata_evolution:
  evolution_instances:
  n8n_data: